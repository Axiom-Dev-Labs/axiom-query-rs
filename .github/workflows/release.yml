name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare release tag with Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "axiom-query-rs") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match crate version v$version"
            exit 1
          fi

  ci:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p axiom-query-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
